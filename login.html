<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register | Adventure Travel Indonesia</title>
  <meta name="description" content="Halaman Masuk dan Pendaftaran Akun Pelanggan Adventure Travel Indonesia.">

  <link rel="icon" href="https://img.icons8.com/color/48/mountain.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animation.css">

  <style>
    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.4);
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      padding: 30px;
      text-align: center;
    }
    .nav-auth-tabs .nav-link {
      color: rgba(255, 255, 255, 0.7);
      font-weight: 700;
      border: none;
      font-size: 1.1rem;
      padding: 12px 25px;
      border-radius: 30px;
    }
    .nav-auth-tabs .nav-link.active {
      color: var(--primary-dark) !important;
      background: var(--accent) !important;
    }
  </style>
</head>
<body style="background: linear-gradient(rgba(7, 62, 39, 0.8), rgba(11, 93, 59, 0.85)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600') center/cover fixed; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Preloader -->
  <div id="preloader">
    <div class="spinner"></div>
    <h4 class="font-weight-bold" style="letter-spacing: 2px;">ADVENTURE TRAVEL</h4>
  </div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fas fa-mountain text-warning me-2"></i>Adventure<span>Travel</span>
      </a>
      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <i class="fas fa-bars"></i>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Tentang Kami</a></li>
          <li class="nav-item"><a class="nav-link" href="destination.html">Destinasi</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Galeri</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Kontak</a></li>
          <li class="nav-item ms-lg-2">
            <a class="nav-link btn-nav-book text-dark px-4" href="booking.html"><i class="fas fa-compass me-1"></i> Book Trip</a>
          </li>
        </ul>
        <div id="navbarAuthContainer" class="d-inline-block"></div>
      </div>
    </div>
  </nav>

  <!-- Auth Main Form Container -->
  <div class="container my-auto py-5" style="margin-top: 100px !important;">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8" data-aos="zoom-in">
        
        <div class="auth-card">
          <div class="auth-header">
            <h2 class="font-weight-bold mb-2"><i class="fas fa-user-lock me-2 text-warning"></i> Akun Pelanggan</h2>
            <p class="small text-white-50 mb-4">Masuk atau Daftar untuk Memulai Pemesanan Wisata Alam</p>

            <ul class="nav nav-pills justify-content-center nav-auth-tabs" id="authTab" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab">
                  <i class="fas fa-sign-in-alt me-1"></i> Login
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab">
                  <i class="fas fa-user-plus me-1"></i> Register
                </button>
              </li>
            </ul>
          </div>

          <div class="p-4 p-md-5">
            <div class="tab-content" id="authTabContent">
              
              <!-- LOGIN FORM -->
              <div class="tab-pane fade show active" id="login-panel" role="tabpanel">
                <form id="userLoginForm" onsubmit="handleUserLogin(event)">
                  <div class="mb-3">
                    <label class="form-label font-weight-bold text-dark">Alamat Email *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                      <input type="email" id="loginEmail" class="form-control" placeholder="" required>
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label font-weight-bold text-dark">Password *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                      <input type="password" id="loginPassword" class="form-control" placeholder="" required>
                    </div>
                  </div>

                  <button type="submit" id="btnLoginSubmit" class="btn btn-success w-100 font-weight-bold py-3 fs-5 rounded-pill shadow mb-3">
                    <i class="fas fa-paper-plane me-1"></i> Masuk Sekarang
                  </button>
                </form>
              </div>

              <!-- REGISTER FORM -->
              <div class="tab-pane fade" id="register-panel" role="tabpanel">
                <form id="userRegisterForm" onsubmit="handleUserRegister(event)">
                  <div class="mb-3">
                    <label class="form-label font-weight-bold text-dark">Nama Lengkap *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                      <input type="text" id="regName" class="form-control" placeholder="" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label font-weight-bold text-dark">Alamat Email *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                      <input type="email" id="regEmail" class="form-control" placeholder="" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label font-weight-bold text-dark">Nomor HP / WhatsApp *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="fab fa-whatsapp text-muted"></i></span>
                      <input type="tel" id="regPhone" class="form-control" placeholder="" required>
                    </div>
                  </div>

                  <div class="mb-4">
                    <label class="form-label font-weight-bold text-dark">Password *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                      <input type="password" id="regPassword" class="form-control" placeholder="" required minlength="6">
                    </div>
                  </div>

                  <button type="submit" id="btnRegisterSubmit" class="btn btn-warning text-dark w-100 font-weight-bold py-3 fs-5 rounded-pill shadow">
                    <i class="fas fa-user-plus me-1"></i> Daftar Akun Baru
                  </button>
                </form>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/script.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    // User Login Logic
    async function handleUserLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const submitBtn = document.getElementById('btnLoginSubmit');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses Login...';

      const invalidMsg = "Email atau kata sandi yang Anda masukkan salah. Silakan periksa kembali!";

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          setLoggedInUser(data.user, data.token);
          alert(`Selamat Datang, ${data.user.name}! Login Berhasil.`);

          if (data.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
          return;
        } else {
          alert(data.message || invalidMsg);
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          return;
        }
      } catch (err) {
        console.log('Backend offline, checking client storage fallback.', err);
      }

      // Offline / Local Storage Fallback Validation
      if (email.toLowerCase() === 'admin@adventuretravel.id' && password === 'admin123') {
        const adminUser = { id: 'admin1', name: 'Administrator Adventure', email: 'admin@adventuretravel.id', role: 'admin', phone: '089517846680' };
        setLoggedInUser(adminUser, 'mock_token_admin');
        alert(`Login Admin Berhasil! Selamat datang, ${adminUser.name}.`);
        window.location.href = 'admin.html';
        return;
      }

      let registeredUsers = JSON.parse(localStorage.getItem('adventure_registered_users') || '[]');
      let user = registeredUsers.find(u => u.email.toLowerCase() === email.toLowerCase());

      if (user && (user.password === password || !user.password)) {
        setLoggedInUser(user, 'mock_user_token');
        alert(`Login Berhasil! Selamat Datang, ${user.name}.`);
        window.location.href = 'index.html';
      } else {
        alert(invalidMsg);
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }

    // User Register Logic
    async function handleUserRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;

      const submitBtn = document.getElementById('btnRegisterSubmit');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses Pendaftaran...';

      const newUserObj = { id: 'u_' + Date.now(), name, email, phone, role: 'user' };

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store in LocalStorage too for offline state sync
          let registered = JSON.parse(localStorage.getItem('adventure_registered_users') || '[]');
          if (!registered.some(u => u.email.toLowerCase() === email.toLowerCase())) {
            registered.push({ ...newUserObj, id: data.user?.id || newUserObj.id });
            localStorage.setItem('adventure_registered_users', JSON.stringify(registered));
          }

          setLoggedInUser(data.user, data.token);
          alert(`Pendaftaran Berhasil! Selamat Datang, ${data.user.name}. Akun Anda telah aktif.`);
          window.location.href = 'index.html';
          return;
        } else {
          alert(data.message || 'Pendaftaran gagal. Silakan coba lagi.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
          return;
        }
      } catch (err) {
        console.log('Backend offline, using client registration fallback.', err);
      }

      // Standalone Registration Fallback
      let registered = JSON.parse(localStorage.getItem('adventure_registered_users') || '[]');
      if (registered.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        alert('Email sudah terdaftar. Silakan gunakan email lain atau login!');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        return;
      }

      registered.push({ ...newUserObj, password });
      localStorage.setItem('adventure_registered_users', JSON.stringify(registered));

      setLoggedInUser(newUserObj, 'mock_reg_token');
      alert(`Pendaftaran Akun Baru Berhasil! Selamat Datang, ${name}. Akun Anda telah aktif.`);
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
