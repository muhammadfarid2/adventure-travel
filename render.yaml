services:
  - type: web
    name: adventure-travel-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adventure-travel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: adventure-travel-db
    databaseName: adventure_travel
    user: adventure_user
