  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/script.js?v=2.0"></script>
  <script src="js/navbar.js?v=2.0"></script>

  <script>
    // Specific Gallery Masonry Logic
    document.addEventListener('DOMContentLoaded', () => {
      renderGallery('All');

      const gBtns = document.querySelectorAll('.gallery-btn');
      gBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          gBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const category = e.target.getAttribute('data-category');
          renderGallery(category);
        });
      });
    });

    async function renderGallery(category = 'All') {
      const container = document.getElementById('galleryMasonryContainer');
      if (!container) return;

      let items = window.dummyGallery || [];
      try {
        const res = await fetch('/api/gallery');
        if (res.ok) {
          const apiItems = await res.json();
          if (apiItems.length > 0) items = apiItems;
        }
      } catch (err) {}

      let filtered = items.filter(item => category === 'All' || item.category.toLowerCase() === category.toLowerCase());

      container.innerHTML = '';
      filtered.forEach((item, index) => {
        const itemHtml = `
          <div class="gallery-item" data-aos="fade-up" data-aos-delay="${(index % 6) * 100}" onclick="openLightbox('${item.image}', '${item.title} - ${item.category}')">
            <img src="${item.image}" alt="${item.title}">
            <div class="gallery-item-overlay">
              <i class="fas fa-search-plus fa-2x mb-2 text-warning"></i>
              <h5>${item.title}</h5>
              <span class="badge bg-warning text-dark">${item.category}</span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    function openLightbox(imgUrl, caption) {
      document.getElementById('lightboxImg').src = imgUrl;
      document.getElementById('lightboxCaption').textContent = caption;
      const modal = new bootstrap.Modal(document.getElementById('lightboxModal'));
      modal.show();
    }
  </script>
</body>
</html>
